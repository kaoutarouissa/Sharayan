services:

  mysql:
    image: mysql:8.0
    container_name: sharayan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sharayan
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./sharayan-backend
    container_name: sharayan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./sharayan-backend:/var/www
    depends_on:
      - mysql

  frontend:
    build:
      context: ./sharayan-frontend
    container_name: sharayan-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./sharayan-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data: